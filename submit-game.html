<script>

/*
==========================================================
QPG GAME SUBMISSION
FRONTEND
==========================================================

IMPORTANT:
Put ONLY your deployed Google Apps Script /exec URL here.

Example:

https://script.google.com/macros/s/XXXXXXXXXXXX/exec

DO NOT add:
?action=submit
?email=
?gameName=

Just the /exec URL.
==========================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbw4ECyaxz4QugI_PVUoFpikzONV8Xu9tRLuBrz1C3SU6YXy_40qLM9PVIAV4yBrqHef/exec";

/*
==========================================================
ELEMENTS
==========================================================
*/

const form =
  document.getElementById("gameSubmissionForm");

const submitButton =
  document.getElementById("submitButton");

const formPage =
  document.getElementById("formPage");

const waitingPage =
  document.getElementById("waitingPage");

const approvedPage =
  document.getElementById("approvedPage");

const declinedPage =
  document.getElementById("declinedPage");

const errorBox =
  document.getElementById("errorBox");

const submissionIdElement =
  document.getElementById("submissionId");


/*
==========================================================
CURRENT SUBMISSION
==========================================================
*/

let currentSubmissionId = null;
let currentStatusToken = null;

let statusTimer = null;
let statusAttempts = 0;


/*
==========================================================
SHOW ERROR
==========================================================
*/

function showError(message){

  errorBox.textContent =
    message;

  errorBox.classList.add(
    "show"
  );

}


/*
==========================================================
HIDE ERROR
==========================================================
*/

function hideError(){

  errorBox.textContent =
    "";

  errorBox.classList.remove(
    "show"
  );

}


/*
==========================================================
SHOW PAGE
==========================================================
*/

function showOnly(page){

  formPage.style.display =
    "none";

  waitingPage.classList.remove(
    "show"
  );

  approvedPage.classList.remove(
    "show"
  );

  declinedPage.classList.remove(
    "show"
  );


  if(page === "form"){

    formPage.style.display =
      "block";

  }


  if(page === "waiting"){

    waitingPage.classList.add(
      "show"
    );

  }


  if(page === "approved"){

    approvedPage.classList.add(
      "show"
    );

  }


  if(page === "declined"){

    declinedPage.classList.add(
      "show"
    );

  }

}


/*
==========================================================
GENERATE RANDOM ID
==========================================================

This ID is safe to use as a submission identifier.

The backend uses this same ID.
==========================================================
*/

function generateSubmissionId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
      "function"
  ){

    return (
      "QPG-" +
      window.crypto
        .randomUUID()
        .replace(/-/g, "")
        .substring(0, 20)
        .toUpperCase()
    );

  }


  return (
    "QPG-" +
    Date.now().toString(36).toUpperCase() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 12)
      .toUpperCase()
  );

}


/*
==========================================================
GENERATE STATUS TOKEN
==========================================================

This gives the public status checker an additional
random value instead of relying only on the game name
and email address.
==========================================================
*/

function generateStatusToken(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
      "function"
  ){

    return (
      window.crypto.randomUUID() +
      window.crypto.randomUUID()
    );

  }


  return (
    Math.random().toString(36) +
    Date.now().toString(36) +
    Math.random().toString(36)
  );

}


/*
==========================================================
SAVE PENDING SUBMISSION
==========================================================
*/

function savePendingSubmission(){

  const data = {

    id:
      currentSubmissionId,

    token:
      currentStatusToken

  };


  localStorage.setItem(

    "qpgPendingSubmission",

    JSON.stringify(data)

  );

}


/*
==========================================================
LOAD PENDING SUBMISSION
==========================================================
*/

function loadPendingSubmission(){

  try{

    const saved =
      localStorage.getItem(
        "qpgPendingSubmission"
      );


    if(!saved){

      return null;

    }


    const data =
      JSON.parse(
        saved
      );


    if(
      !data ||
      !data.id ||
      !data.token
    ){

      return null;

    }


    return data;

  }catch(error){

    console.error(
      "Could not load pending submission:",
      error
    );

    return null;

  }

}


/*
==========================================================
CLEAR PENDING SUBMISSION
==========================================================
*/

function clearPendingSubmission(){

  localStorage.removeItem(
    "qpgPendingSubmission"
  );

}


/*
==========================================================
FORM SUBMISSION
==========================================================
*/

form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    hideError();


    /*
    ======================================================
    CHECK API URL
    ======================================================
    */

    if(
      API_URL.includes(
        "PASTE_YOUR"
      )
    ){

      showError(
        "The QPG submission system has not been connected yet. Add your Google Apps Script /exec URL."
      );

      return;

    }


    /*
    ======================================================
    CHECK API URL FORMAT
    ======================================================
    */

    if(
      !API_URL.includes(
        "/exec"
      )
    ){

      showError(
        "Your Google Apps Script URL looks incorrect. Use the Web App URL ending in /exec."
      );

      return;

    }


    /*
    ======================================================
    GET GAME LINK
    ======================================================
    */

    const gameLink =
      document
        .getElementById("gameLink")
        .value
        .trim();


    try{

      const url =
        new URL(
          gameLink
        );


      if(
        url.protocol !== "https:" &&
        url.protocol !== "http:"
      ){

        throw new Error();

      }

    }catch(error){

      showError(
        "Please enter a valid game link beginning with http:// or https://."
      );

      return;

    }


    /*
    ======================================================
    CONFIRMATION
    ======================================================

    If the user presses Cancel:

    NOTHING IS SENT.
    NOTHING IS SAVED.
    ======================================================
    */

    const confirmed =
      window.confirm(

`Submit this game for QPG verification?

Your game details and complete game code will be sent to the QPG review team.

Press OK to submit.
Press Cancel to do nothing.`

      );


    if(!confirmed){

      return;

    }


    /*
    ======================================================
    GENERATE TRACKING INFORMATION
    ======================================================
    */

    currentSubmissionId =
      generateSubmissionId();


    currentStatusToken =
      generateStatusToken();


    /*
    ======================================================
    COLLECT FORM DATA
    ======================================================
    */

    const data = {

      action:
        "submit",

      submissionId:
        currentSubmissionId,

      statusToken:
        currentStatusToken,

      userName:
        document
          .getElementById("userName")
          .value
          .trim(),

      gameName:
        document
          .getElementById("gameName")
          .value
          .trim(),

      gameEmoji:
        document
          .getElementById("gameEmoji")
          .value
          .trim(),

      gameDescription:
        document
          .getElementById("gameDescription")
          .value
          .trim(),

      gameCategory:
        document
          .getElementById("gameCategory")
          .value,

      userEmail:
        document
          .getElementById("userEmail")
          .value
          .trim(),

      userGithub:
        document
          .getElementById("userGithub")
          .value
          .trim(),

      gameLink:
        gameLink,

      gameCode:
        document
          .getElementById("gameCode")
          .value,

      consent:
        "true"

    };


    /*
    ======================================================
    SAVE TRACKING INFO
    ======================================================
    */

    savePendingSubmission();


    /*
    ======================================================
    SHOW WAITING PAGE
    ======================================================
    */

    submissionIdElement.textContent =
      "Submission ID: " +
      currentSubmissionId;


    showOnly(
      "waiting"
    );


    /*
    ======================================================
    DISABLE BUTTON
    ======================================================
    */

    submitButton.disabled =
      true;

    submitButton.textContent =
      "SENDING SUBMISSION...";


    /*
    ======================================================
    CREATE HIDDEN IFRAME
    ======================================================
    */

    const iframeName =
      "qpgSubmitFrame_" +
      Date.now();


    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.name =
      iframeName;

    iframe.style.display =
      "none";


    document.body.appendChild(
      iframe
    );


    /*
    ======================================================
    CREATE POST FORM
    ======================================================

    IMPORTANT:

    The game code is placed into the POST BODY.

    It is NOT placed into the URL.
    ======================================================
    */

    const postForm =
      document.createElement(
        "form"
      );


    postForm.method =
      "POST";

    postForm.action =
      API_URL;

    postForm.target =
      iframeName;

    postForm.style.display =
      "none";


    /*
    ======================================================
    ADD FIELDS
    ======================================================
    */

    Object.keys(data).forEach(
      function(key){

        const input =
          document.createElement(
            "input"
          );


        input.type =
          "hidden";

        input.name =
          key;

        input.value =
          String(
            data[key]
          );


        postForm.appendChild(
          input
        );

      }
    );


    document.body.appendChild(
      postForm
    );


    /*
    ======================================================
    SEND POST
    ======================================================
    */

    postForm.submit();


    /*
    ======================================================
    CLEAN UP AFTER REQUEST
    ======================================================
    */

    setTimeout(
      function(){

        try{
          postForm.remove();
        }catch(error){}

        try{
          iframe.remove();
        }catch(error){}

      },
      30000
    );


    /*
    ======================================================
    START STATUS CHECKING
    ======================================================
    */

    statusAttempts = 0;


    setTimeout(
      function(){

        checkSubmissionStatus();

      },
      5000
    );

  }
);


/*
==========================================================
STATUS CHECK
==========================================================
*/

function checkSubmissionStatus(){

  if(
    !currentSubmissionId ||
    !currentStatusToken
  ){

    return;

  }


  statusAttempts++;


  const callbackName =
    "qpgStatus_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  let finished =
    false;


  /*
  ========================================================
  CALLBACK
  ========================================================
  */

  window[callbackName] =
    function(result){

      if(finished){

        return;

      }


      finished =
        true;


      cleanupJSONP(
        callbackName
      );


      /*
      ====================================================
      INVALID RESPONSE
      ====================================================
      */

      if(
        !result
      ){

        scheduleNextStatusCheck();

        return;

      }


      /*
      ====================================================
      SUBMISSION NOT FOUND
      ====================================================

      This can happen while Google Apps Script is still
      processing the POST.

      Give it several attempts before showing an error.
      ====================================================
      */

      if(
        result.ok === false
      ){

        if(
          statusAttempts >= 6
        ){

          showOnly(
            "form"
          );

          submitButton.disabled =
            false;

          submitButton.textContent =
            "📤 Submit for Verification";


          showError(

            "We could not find your submission on the server. Please check your Google Apps Script deployment and try again."

          );


          clearPendingSubmission();

          return;

        }


        scheduleNextStatusCheck();

        return;

      }


      /*
      ====================================================
      APPROVED
      ====================================================
      */

      if(
        result.status ===
        "approved"
      ){

        const gameName =
          result.gameName ||
          "Your game";


        document.getElementById(
          "approvedGameText"
        ).textContent =

          '"' +
          gameName +
          '" is now live on QPG Hub.';


        clearPendingSubmission();


        showOnly(
          "approved"
        );


        stopStatusPolling();


        return;

      }


      /*
      ====================================================
      DECLINED
      ====================================================
      */

      if(
        result.status ===
        "declined"
      ){

        const reason =
          result.reason
            ? "Reason: " +
              result.reason
            : "Thank you for submitting your game.";


        document.getElementById(
          "declineReasonText"
        ).textContent =
          reason;


        clearPendingSubmission();


        showOnly(
          "declined"
        );


        stopStatusPolling();


        return;

      }


      /*
      ====================================================
      STILL PENDING
      ====================================================
      */

      scheduleNextStatusCheck();

    };


  /*
  ========================================================
  CREATE JSONP SCRIPT
  ========================================================
  */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  /*
  ========================================================
  IMPORTANT

  The status request contains ONLY:

  - action
  - submission ID
  - random status token
  - callback

  It does NOT contain the game code.
  ========================================================
  */

  script.src =

    API_URL +

    "?action=status" +

    "&id=" +
    encodeURIComponent(
      currentSubmissionId
    ) +

    "&token=" +
    encodeURIComponent(
      currentStatusToken
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function(){

      if(finished){

        return;

      }


      finished =
        true;


      cleanupJSONP(
        callbackName
      );


      scheduleNextStatusCheck();

    };


  document.body.appendChild(
    script
  );


  /*
  ========================================================
  TIMEOUT
  ========================================================
  */

  setTimeout(
    function(){

      if(finished){

        return;

      }


      finished =
        true;


      cleanupJSONP(
        callbackName
      );


      scheduleNextStatusCheck();

    },
    10000
  );

}


/*
==========================================================
NEXT STATUS CHECK
==========================================================
*/

function scheduleNextStatusCheck(){

  if(statusTimer){

    clearTimeout(
      statusTimer
    );

  }


  statusTimer =
    setTimeout(
      function(){

        checkSubmissionStatus();

      },
      15000
    );

}


/*
==========================================================
STOP STATUS POLLING
==========================================================
*/

function stopStatusPolling(){

  if(statusTimer){

    clearTimeout(
      statusTimer
    );

    statusTimer =
      null;

  }

}


/*
==========================================================
CLEAN JSONP
==========================================================
*/

function cleanupJSONP(
  callbackName
){

  const script =
    document.getElementById(
      callbackName
    );


  if(script){

    script.remove();

  }


  try{

    delete window[
      callbackName
    ];

  }catch(error){}

}


/*
==========================================================
RESUME AFTER PAGE RELOAD
==========================================================

If someone submits a game and accidentally refreshes the
page, the browser can continue checking the submission.
==========================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  function(){

    const pending =
      loadPendingSubmission();


    if(
      !pending
    ){

      return;

    }


    currentSubmissionId =
      pending.id;

    currentStatusToken =
      pending.token;


    submissionIdElement.textContent =
      "Submission ID: " +
      currentSubmissionId;


    showOnly(
      "waiting"
    );


    submitButton.disabled =
      true;


    submitButton.textContent =
      "SUBMISSION IN REVIEW";


    statusAttempts = 0;


    setTimeout(
      function(){

        checkSubmissionStatus();

      },
      2000
    );

  }
);

</script>
